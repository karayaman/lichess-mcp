# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml

startCommand:
  type: stdio
  configSchema:
    # JSON Schema defining the configuration options for the MCP.
    type: object
    required: []
    properties:
      lichessToken:
        type: string
        description: Lichess API token
  commandFunction:
    # A JS function that produces the CLI command based on the given config to start the MCP on stdio.
    |-
    (config) => ({ command: 'node', args: ['build/index.js'], env: config.lichessToken ? { LICHESS_TOKEN: config.lichessToken } : undefined })
  exampleConfig:
    lichessToken: your-lichess-api-token
